# ~/.config/tmux/tmux.conf
# Entrypoint. Statusline/window/border/message colours live in statusline.conf
# (sourced last) — keep them out of this file so source order can't clobber them.

#### Terminal & colour ########################################################

# Terminfo advertised to programs running *inside* tmux (not the outer term).
set -g default-terminal "tmux-256color"

# Per-terminal capabilities, keyed on the OUTER $TERM:
#   RGB        truecolor
#   usstyle    undercurl + underline colour (replaces the old manual
#              Smulx/Setulc terminal-overrides; tmux 3.4+ drives it from terminfo)
#   clipboard  OSC 52 system-clipboard writes (works with set-clipboard below)
#   hyperlinks OSC 8 clickable links passthrough
set -as terminal-features ",xterm-ghostty:RGB:usstyle:clipboard:hyperlinks"
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard:hyperlinks"

# Send copies to the system clipboard via the outer terminal (OSC 52). On
# Wayland/Ghostty this makes mouse-selection and copy-mode yanks land in the
# Wayland clipboard with no external tool — no keybindings required.
set -g set-clipboard on

#### General options ##########################################################

set-option -g prefix C-b
set-option -g focus-events on            # neovim autoread / FocusGained|Lost
set-window-option -g mode-keys vi

# Repeat window (ms) during which a `-r` binding repeats without the prefix.
# Must be > 0 or the `bind -r` pane select/resize below stop repeating.
set-option -g repeat-time 300

# Low (not zero) so Esc is snappy in (neo)vim without truncating escape
# sequences over slow/SSH links. Explicit because the shared Debian host may
# ship an older tmux whose default is 500ms.
set -sg escape-time 10

set-option -g history-limit 64096
set -g mouse on                          # wheel-scroll, click-select, drag-resize

# Quality-of-life defaults (none of these touch keybindings):
set -g base-index 1                      # windows start at 1
setw -g pane-base-index 1                # panes start at 1
set -g renumber-windows on               # no gaps after closing a window
set -g detach-on-destroy off             # switch session instead of detaching
set -g display-time 2000                 # show status messages (e.g. "Reloaded!") longer
set -g display-panes-time 2000           # show pane numbers longer
setw -g aggressive-resize on             # resize to smallest *viewing* client

# Dim inactive panes' content (active pane stays brighter)
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default

# Let the title bar adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# pane-number / clock colours not touched by statusline.conf
set-option -g display-panes-active-colour colour33   # blue
set-option -g display-panes-colour colour166         # orange
set-window-option -g clock-mode-colour colour64       # green

#### Key bindings #############################################################

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "xdg-open #{pane_current_path}"
# Kill all panes but the current one
bind -r e kill-pane -a

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Move window left/right
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resize pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# lazygit popup
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

#### Statusline (sourced last; owns status/window/border/message colours) #####

source ~/.config/tmux/statusline.conf
