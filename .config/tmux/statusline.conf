# vim: ft=tmux
set -g mode-style "fg=#c0caf5,bg=#24283b"

set -g message-style "fg=#c0caf5,bg=#24283b"
set -g message-command-style "fg=#c0caf5,bg=#24283b"

set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#c0caf5"

set -g status "on"
set -g status-interval 5
set -g status-justify "left"
set -g status-position "bottom"

set -g status-style "fg=#565f89,bg=#24283b"

set -g status-bg "#1a1b26"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#24283b,bg=#c0caf5,bold] #S #[fg=#c0caf5,bg=#7aa2f7,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#7aa2f7,bold] #(whoami) #[fg=#7aa2f7,bg=#1a1b26]"
set -g status-right "#[fg=#565f89,bg=#1a1b26,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#565f89]#[fg=#737aa2,bg=#565f89,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#737aa2]#[fg=#7aa2f7,bg=#737aa2,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#7aa2f7,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1a1b26"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1a1b26"

setw -g window-status-format '#[fg=#1a1b26,bg=#1a1b26]#[default] #I  #W #[fg=#1a1b26,bg=#1a1b26,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1a1b26,bg=#c0caf5]#[fg=#3d59a1,bg=#c0caf5] #I #[fg=#c0caf5,bg=#3d59a1] #W #[fg=#3d59a1,bg=#1a1b26,nobold]'
