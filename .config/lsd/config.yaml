# lsd configuration — https://github.com/lsd-rs/lsd
# Custom colour palette lives in themes/custom.yaml (see `color.theme` below).

# == Color ==
color:
  # auto = colourise only when writing to a terminal (so `lsd | grep` and
  # pagers don't get raw escape codes). Possible values: never, auto, always
  when: auto
  # Loads ~/.config/lsd/themes/custom.yaml
  theme: custom

# == Icons ==
icons:
  # auto = icons only on a terminal, omitted when piped. (was: always)
  when: auto
  # Possible values: fancy, unicode  (fancy needs a Nerd Font)
  theme: fancy
  separator: " "

# == Layout ==
# Possible values: grid, tree, oneline
layout: oneline

# == Sorting ==
sorting:
  # Possible values: name, time, size, version, extension, git, none
  column: name
  reverse: false
  # Group directories ahead of files. Possible values: none, first, last
  dir-grouping: first

# == Long-listing blocks ==
# Columns shown with -l. Dropped `group` for a more compact line.
# Possible values: permission, user, group, size, date, name, inode, links, ...
blocks:
  - permission
  - user
  - size
  - date
  - name

# == Date ==
# relative = "2 days ago" style; pairs with the date colours in the theme.
# Possible values: date, relative, +<strftime-format>
date: relative

# == Size ==
# Possible values: default, short, bytes
size: short

# == Permission ==
# Possible values: rwx, octal, attributes, disable
permission: rwx

# == Misc ==
hyperlink: never
no-symlink: false
symlink-arrow: ⇒
