# Window rule
windowrule= match:class ^(GTK Application)$, size 50% 70%
windowrule= match:class ^(GTK Application)$, center on
windowrule = match:fullscreen 1, border_size 0

# no gaps in fullscreen
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# assign apps to dedicated workspaces (i3 `assign` equivalent). Match strings are
# the Wayland app_id / class from `hyprctl clients` — these differ from i3's X11
# WM_CLASS (e.g. ghostty = com.mitchellh.ghostty, firefox-dev = firefox-developer-
# edition). `silent` opens the window on its workspace without switching focus
# there, like i3 `assign`. Hyprland 0.55.x rule syntax is `match:class ^(...)$`
# (the old bare `class:(...)` form errors with "invalid field ... missing a value").
windowrule = workspace 1 silent, match:class ^(neovide)$
windowrule = workspace 2 silent, match:class ^(com.mitchellh.ghostty)$
windowrule = workspace 3 silent, match:class ^(google-chrome)$
windowrule = workspace 4 silent, match:class ^(firefox-developer-edition)$
